[package]
name = "eth-state-diff"
version = "0.2.0"
edition = "2021"
authors = ["galadd <gbolahanf.14@gmail.com>"]
description = "Fork-aware, domain-specific delta encoding for Ethereum beacon state. Optimized for disk archival and zstd compression."
repository = "https://github.com/galadd/eth_state_diff"
license = "MIT OR Apache-2.0"
keywords = [
	"ethereum",
	"beacon-chain",
	"state-diff",
	"ssz",
	"delta-encoding",
	"archival",
]
categories = ["compression", "encoding", "cryptography::cryptocurrencies"]

[dependencies]
rkyv = "0.8.17"
rustc-hash = "2.0"

[package.metadata.docs.rs]
all-features = true
